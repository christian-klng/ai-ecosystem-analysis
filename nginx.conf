# nginx-Konfiguration für die statisch gebaute Astro-Seite.
# Ausgelegt auf: Clean URLs (directory format), korrektes Caching, und – wichtig –
# das Zulassen von Einbettung per iFrame (kein X-Frame-Options / restriktives CSP),
# weil die Einbettbarkeit ein Kernmerkmal des Tools ist.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kompression für Text-Formate
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/atom+xml
        image/svg+xml;

    # Sicherheits-Header. BEWUSST kein X-Frame-Options und keine frame-ancestors-
    # Einschränkung: Partner sollen das Verzeichnis einbetten können (?embed=1).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Atom-Feed mit korrektem Medientyp ausliefern.
    location = /aenderungen.xml {
        default_type application/atom+xml;
        add_header Cache-Control "public, max-age=900" always;
    }

    # Offene Daten: kurz cachen, damit Änderungen zeitnah sichtbar werden.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=900" always;
        try_files $uri =404;
    }

    # Gehashte Astro-Assets sind unveränderlich → lange cachen.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Statische Einzeldateien (favicon etc.)
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # HTML nicht dauerhaft cachen, damit redaktionelle Aktualisierungen schnell greifen.
    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        # Clean URLs: /angebote/slug -> /angebote/slug/index.html
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
